name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    # This is an upstream-org issue-management workflow: it hardcodes the
    # deepseek-harness/deepseek-harness project and org secrets. On a fork
    # (e.g. Happy2Git/deepseek-harness) those don't exist and it would 404 /
    # false-fail on every PR, so only run it on the canonical upstream repo.
    if: github.repository == 'deepseek-harness/deepseek-harness'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs pr

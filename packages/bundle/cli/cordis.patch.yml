# The dsh-cli bundle patch: the interactive terminal surface over dsh-base.
# Applied after dsh-base's insert; rows here override base rows by id, with the
# profile's own cordis.patch.yml and any --patch overlays still to come.
#
# The cli-tui row mounts the terminal front door, which owns terminal input and
# presentation only (the `commands` / `approval` / `userQuestions` seams and the
# session transcript). Agent lifecycle, persistence, and tools stay in dsh-base.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the other surfaces.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: cli-startup
      name: '@deepseek-ai/dsh-cli/startup'

    - id: cli-tui
      name: '@deepseek-ai/dsh-tui'
      inject: [cliStartup]
